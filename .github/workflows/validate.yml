name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python deps
        run: pip install pillow
      - name: Release file checks
        run: python3 tools/validate_release.py
      - name: Web typecheck and lexicon smoke
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit
          node scripts/smoke.mjs
