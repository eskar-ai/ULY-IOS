name: Android CI

on:
  push:
    branches: ["cursor/android-uly-keyboard-9edd"]
    paths:
      - "android/**"
      - "data/generated/lexicon.json"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "android/**"

jobs:
  unit-tests:
    name: uly-engine unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Sync lexicon
        run: ./scripts/sync-lexicon.sh
      - name: Unit tests
        run: ./scripts/run-unit-tests.sh
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace
