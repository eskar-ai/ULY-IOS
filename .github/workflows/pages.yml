name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "store/site/**"
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build offline web demo
        working-directory: web
        env:
          VITE_BASE: /ULY-IOS/demo/
        run: |
          npm ci
          npm run build

      - name: Prepare site artifact
        run: |
          mkdir -p _site/demo
          cp -a store/site/. _site/
          cp -a web/dist/. _site/demo/
          test -f store/site/CNAME && cp store/site/CNAME _site/ || true

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # First run can create the Pages site when Settings → Pages is still unset.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
