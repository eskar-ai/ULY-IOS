name: UyghurLatin
options:
  bundleIdPrefix: org.uyghurlatin
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  UyghurLatinKit:
    path: ..
targets:
  UyghurLatin:
    type: application
    platform: iOS
    sources:
      - path: UyghurLatin
        excludes:
          - Resources/**
          - "**/*.json"
    resources:
      - path: UyghurLatin/Resources
      - path: UyghurLatin/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.uyghurlatin.app
        INFOPLIST_FILE: UyghurLatin/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: UyghurLatinKeyboard

  UyghurLatinKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: UyghurLatinKeyboard
        excludes:
          - Resources/**
          - "**/*.json"
          - "**/*.md"
    resources:
      - path: UyghurLatinKeyboard/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.uyghurlatin.app.keyboard
        INFOPLIST_FILE: UyghurLatinKeyboard/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        SKIP_INSTALL: true
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
    dependencies:
      - package: UyghurLatinKit
        product: UyghurLatinKit
